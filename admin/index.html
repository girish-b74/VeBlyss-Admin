<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeBlyss Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f0e7;color:#173b38}header{background:#173b38;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}main{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;margin:6px 0 14px;border:1px solid #ccc;border-radius:8px}button{background:#b18a3b;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;margin-right:8px}button.secondary{background:#173b38}button.danger{background:#8d3030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.product{border:1px solid #ddd;border-radius:10px;padding:14px}.product img{width:100%;height:160px;object-fit:contain;background:#fafafa}.hidden{display:none}.muted{color:#667}.row{display:flex;gap:12px}.row>*{flex:1}@media(max-width:600px){.row{display:block}}</style></head><body><header><strong>VeBlyss Admin</strong><span id="who"></span><button id="logout" class="secondary">Logout</button></header><main><section id="login" class="card"><h2>Secure Admin Login</h2><label>Admin ID</label><input id="email" type="text" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button onclick="login()">Sign In</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hidden"><div class="card"><h2 id="formTitle">Add Product</h2><input type="hidden" id="editId"><div class="row"><div><label>Product ID</label><input id="id" placeholder="e.g. sandalwood-incense"></div><div><label>Product Name</label><input id="name"></div></div><div class="row"><div><label>Category</label><input id="category"></div><div><label>MRP (₹, inclusive GST)</label><input id="price" type="number" min="0"></div></div><label>Product Image</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><label>Short Description</label><input id="short"></div><label>Full Description</label><textarea id="description" rows="4"></textarea><div class="row"><div><label>Features (one per line)</label><textarea id="features" rows="5"></textarea></div><div><label>Specifications (one per line)</label><textarea id="specifications" rows="5"></textarea></div></div><label><input id="published" type="checkbox" checked style="width:auto"> Published</label><br><button onclick="save()">Save Product</button><button class="secondary" onclick="resetForm()">Clear</button><p id="msg" class="muted"></p></div><div class="card"><h2>Products</h2><div id="products" class="grid"></div></div></section></main><script>
const $=id=>document.getElementById(id); async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});showApp()}catch(e){$('loginMsg').textContent=e.message}}
async function boot(){try{const me=await api('/api/admin/me');$('who').textContent=me.email;showApp()}catch(e){$('login').classList.remove('hidden');$('app').classList.add('hidden')}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
async function load(){const ps=await api('/api/products');$('products').innerHTML=ps.map(p=>`<div class="product"><img src="${p.image||''}"><h3>${esc(p.name)}</h3><div>₹${p.price.toLocaleString('en-IN')} <span class="muted">• ${p.published?'Published':'Hidden'}</span></div><p class="muted">${esc(p.category)}</p><button onclick='edit(${JSON.stringify(p)})'>Edit</button><button class="danger" onclick="del('${p.id}')">Delete</button></div>`).join('')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function edit(p){$('formTitle').textContent='Edit Product';$('editId').value=p.id;$('id').value=p.id;$('id').disabled=true;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('short').value=p.short_description;$('description').value=p.description;$('features').value=(p.features||'').split('|').join('\n');$('specifications').value=(p.specifications||'').split('|').join('\n');$('published').checked=!!p.published;scrollTo({top:0,behavior:'smooth'})}
function resetForm(){document.querySelectorAll('input,textarea').forEach(x=>{if(x.id!=='published')x.value=''});$('published').checked=true;$('id').disabled=false;$('editId').value='';$('formTitle').textContent='Add Product';$('imageFile').value=''}
async function save(){try{const fd=new FormData();const editId=$('editId').value;['id','name','category','price','short','description'].forEach(k=>{const map={short:'short_description'};fd.append(map[k]||k,$(k).value)});fd.append('features',$('features').value.split('\n').filter(Boolean).join('|'));fd.append('specifications',$('specifications').value.split('\n').filter(Boolean).join('|'));fd.append('published',$('published').checked?'1':'0');if($('imageFile').files[0])fd.append('image',$('imageFile').files[0]);await api(editId?'/api/products/'+editId:'/api/products',{method:editId?'PUT':'POST',body:fd});$('msg').textContent='Product saved successfully.';resetForm();load()}catch(e){$('msg').textContent=e.message}}
async function del(id){if(!confirm('Delete this product?'))return;try{await api('/api/products/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}boot();</script></body></html>
