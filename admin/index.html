<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VeBlyss Admin</title><style>
:root{--teal:#173b38;--gold:#b18a3b;--cream:#f5f0e7;--ink:#203a37}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:var(--ink)}header{background:var(--teal);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:20px}main{max-width:1150px;margin:30px auto;padding:0 18px}.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 4px 18px #0001}h1,h2,h3{margin-top:0}label{font-size:14px;font-weight:600}input,textarea,select{width:100%;padding:11px;margin:6px 0 14px;border:1px solid #cfcfcf;border-radius:8px;font:inherit}textarea{resize:vertical}button{background:var(--gold);color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;font-weight:600}button.secondary{background:var(--teal)}button.danger{background:#8d3030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.product{border:1px solid #ddd;border-radius:10px;padding:14px}.product img{width:100%;height:170px;object-fit:contain;background:#fafafa;border-radius:8px}.muted{color:#667}.hidden{display:none}.row{display:flex;gap:14px}.row>*{flex:1}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf3f1;font-size:12px}.actions{margin-top:12px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.error{color:#8d3030}.success{color:#27664e}@media(max-width:650px){.row{display:block}header{padding:16px}.topline{display:block}}
</style></head><body><header><strong>VeBlyss Admin</strong><div><span id="who" style="margin-right:12px"></span><button id="logout" class="secondary">Logout</button></div></header><main>
<section id="login" class="card" style="max-width:520px;margin:60px auto"><h1>Admin Login</h1><p class="muted">Private VeBlyss product management</p><label>Admin ID</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signIn">Sign In</button><p id="loginMsg" class="muted"></p></section>
<section id="app" class="hidden"><div class="card"><div class="topline"><h2 id="formTitle">Add Product</h2><span class="pill">MRP inclusive of GST</span></div><input type="hidden" id="editId"><div class="row"><div><label>Product ID</label><input id="id" placeholder="e.g. sandalwood-incense"></div><div><label>Product Name</label><input id="name"></div></div><div class="row"><div><label>Category</label><input id="category"></div><div><label>MRP (₹)</label><input id="price" type="number" min="0"></div></div><label>Product Image URL</label><input id="image" placeholder="/assets/example.jpg"><small class="muted">For this Vercel test build, use an image URL. Persistent image upload will be added with storage before production.</small><label style="display:block;margin-top:14px">Short Description</label><input id="short"><label>Full Description</label><textarea id="description" rows="4"></textarea><div class="row"><div><label>Features (one per line)</label><textarea id="features" rows="6"></textarea></div><div><label>Specifications (one per line)</label><textarea id="specifications" rows="6"></textarea></div></div><label><input id="published" type="checkbox" checked style="width:auto;margin-right:6px"> Published</label><br><button id="save">Save Product</button> <button id="clear" class="secondary">Clear</button><p id="msg" class="muted"></p></div>
<div class="card"><div class="topline"><h2>Products</h2><button id="refresh" class="secondary">Refresh</button></div><div id="products" class="grid"></div></div></section></main><script>
const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function boot(){try{const me=await api('/api/admin/me');$('who').textContent=me.username;showApp()}catch{$('login').classList.remove('hidden')}}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
$('signIn').onclick=async()=>{try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});showApp()}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='error'}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};$('refresh').onclick=load;
async function load(){try{const ps=await api('/api/admin/products');$('products').innerHTML=ps.map(p=>`<article class="product"><img src="${esc(p.image||'')}" alt=""><h3>${esc(p.name)}</h3><strong>₹${Number(p.price).toLocaleString('en-IN')}</strong><span class="pill">${p.published?'Published':'Hidden'}</span><p class="muted">${esc(p.category)}</p><div class="actions"><button onclick='edit(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Edit</button> <button class="danger" onclick="del('${esc(p.id)}')">Delete</button></div></article>`).join('')||'<p class="muted">No products found.</p>'}catch(e){$('products').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function edit(p){$('formTitle').textContent='Edit Product';$('editId').value=p.id;$('id').value=p.id;$('id').disabled=true;$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('image').value=p.image||'';$('short').value=p.short_description||'';$('description').value=p.description||'';$('features').value=(p.features||[]).join('\n');$('specifications').value=(p.specifications||[]).join('\n');$('published').checked=!!p.published;scrollTo({top:0,behavior:'smooth'})}
function resetForm(){$('editId').value='';$('id').disabled=false;['id','name','category','price','image','short','description','features','specifications'].forEach(k=>$(k).value='');$('published').checked=true;$('formTitle').textContent='Add Product';$('msg').textContent=''}$('clear').onclick=resetForm;
$('save').onclick=async()=>{try{const b={id:$('id').value,name:$('name').value,category:$('category').value,price:$('price').value,image:$('image').value,short_description:$('short').value,description:$('description').value,features:$('features').value,specifications:$('specifications').value,published:$('published').checked};const eid=$('editId').value;await api(eid?'/api/admin/product?id='+encodeURIComponent(eid):'/api/admin/products',{method:eid?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});$('msg').textContent='Product saved successfully.';$('msg').className='success';resetForm();load()}catch(e){$('msg').textContent=e.message;$('msg').className='error'}};
async function del(id){if(!confirm('Delete this product?'))return;try{await api('/api/admin/product?id='+encodeURIComponent(id),{method:'DELETE'});load()}catch(e){alert(e.message)}}boot();
</script></body></html>
