<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeBlyss Admin</title><style>body{font-family:Arial;max-width:1000px;margin:40px auto;padding:20px}input,textarea,button{padding:10px;margin:5px;width:100%;box-sizing:border-box}button{cursor:pointer}.row{border:1px solid #ddd;padding:15px;margin:10px 0}.hidden{display:none}h1{margin-bottom:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><h1>VeBlyss Admin</h1><p id="msg"></p><section id="login"><h2>Admin Login</h2><input id="u" placeholder="Admin ID"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button></section><section id="app" class="hidden"><button onclick="logout()">Logout</button><h2>Products</h2><div id="products"></div><h2>Add Product</h2><div class="grid"><input id="id" placeholder="Product ID"><input id="name" placeholder="Product Name"><input id="cat" placeholder="Category"><input id="mrp" type="number" placeholder="MRP"><input id="img" placeholder="Image URL"><input id="short" placeholder="Short description"></div><textarea id="desc" placeholder="Description"></textarea><button onclick="add()">Add Product</button></section><script>
const $=id=>document.getElementById(id);async function check(){let r=await fetch("/api/admin/me");let x=await r.json();if(x.authenticated){$("login").className="hidden";$("app").className="";load()}}async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("u").value,password:$("p").value})});let x=await r.json();$("msg").textContent=x.error||"Logged in";if(r.ok)check()}async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload()}async function load(){let r=await fetch("/api/admin/products");let ps=await r.json();$("products").innerHTML=ps.map(p=>`<div class="row"><b>${p.name}</b><br>₹${p.mrp} · ${p.published?"Published":"Hidden"}<br><button onclick="toggle('${p.id}',${!p.published})">${p.published?"Hide":"Publish"}</button><button onclick="del('${p.id}')">Delete</button></div>`).join("")}async function add(){let b={id:$("id").value,name:$("name").value,category:$("cat").value,mrp:$("mrp").value,image:$("img").value,short_description:$("short").value,description:$("desc").value};let r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});let x=await r.json();$("msg").textContent=x.error||"Product added";if(r.ok)load()}async function toggle(id,published){await fetch("/api/admin/product",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({id,published})});load()}async function del(id){if(confirm("Delete product?")){await fetch("/api/admin/product",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id})});load()}}check();</script></body></html>
