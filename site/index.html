<!doctype html>
<html lang="en">
<head>

<title>VeBlyss Global — Fashion, Home & Beyond</title>
<meta name="description" content="VeBlyss Global — Connecting India's Artisan Heritage To The World.">
<style>

html,body{margin:0;padding:0;background:#eee9df}

.page{position:relative;width:min(100vw,1536px);line-height:0}
.design{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;display:block;cursor:pointer;background:transparent;border:0;padding:0}
.hotspot:focus-visible{outline:3px solid #e5bd67;outline-offset:3px;border-radius:5px}
.h-home{left:39.4%;top:3.05%;width:4.0%;height:2.7%}
.h-products{left:46.0%;top:3.05%;width:6.0%;height:2.7%}

.h-values{left:62.2%;top:3.05%;width:5.8%;height:2.7%}
.h-contact{left:70.7%;top:3.05%;width:5.0%;height:2.7%}
.h-search{left:81.5%;top:2.7%;width:3.2%;height:3.8%}
.h-enquire{left:85.7%;top:2.5%;width:10.0%;height:5.0%}
.h-hero{left:4.5%;top:24.0%;width:20.0%;height:5.8%}
.h-ghee{left:2.1%;top:41.0%;width:14.0%;height:20.0%}
.h-coconut{left:16.5%;top:41.0%;width:14.0%;height:20.0%}
.h-pooja{left:30.7%;top:41.0%;width:14.0%;height:20.0%}
.h-wallet{left:45.0%;top:41.0%;width:14.0%;height:20.0%}
.h-copper{left:59.5%;top:41.0%;width:14.0%;height:20.0%}
.h-mug{left:74.2%;top:41.0%;width:14.0%;height:20.0%}
.h-story{left:38.7%;top:69.7%;width:8.0%;height:3.8%}
.h-journey{left:58.0%;top:84.25%;width:11.5%;height:3.0%}
.h-footer-home{left:27.0%;top:90.2%;width:3.0%;height:2.2%}
.h-footer-products{left:31.0%;top:90.2%;width:4.3%;height:2.2%}
.h-footer-about{left:36.0%;top:90.2%;width:4.5%;height:2.2%}
.h-footer-values{left:44.0%;top:90.2%;width:5.5%;height:2.8%}
.h-footer-contact{left:51.8%;top:90.2%;width:7.0%;height:2.8%}
.h-footer-phone{left:73.2%;top:90.0%;width:10%;height:2.5%}
.h-footer-email{left:73.0%;top:92.3%;width:12%;height:2.2%}
.h-footer-web{left:73.0%;top:94.4%;width:12%;height:2.2%}
.h-top-logo{left:4%;top:0.9%;width:21%;height:6.5%}

.modal{position:fixed;inset:0;background:rgba(4,35,34,.72);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal.open{display:flex}
.box{width:min(560px,94vw);background:#fbf7ee;border-radius:16px;padding:30px;color:#123b3b;box-shadow:0 25px 70px rgba(0,0,0,.35);line-height:1.5}
.box h2{font:32px Georgia,serif;margin:0 0 10px}
.box p{margin:8px 0;color:#425a5a}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{display:inline-block;border:0;border-radius:8px;padding:12px 18px;background:#dfb65e;color:#173637;font-weight:700;text-decoration:none;cursor:pointer}
.close{float:right;border:0;background:transparent;font-size:28px;cursor:pointer;color:#173637}
.note{font-size:12px;color:#6b7777!important;margin-top:16px!important}

@media(max-width:700px){
  .page{width:100vw}
  /* Keep the approved desktop composition intact and scale it proportionally.
     This preserves the exact design rather than reflowing the artwork and
     changing its visual appearance. */
}
</style>
</head>
<body>
<div class="page" id="page">
  <img class="design" src="veblyss-homepage-design.png" alt="VeBlyss Global homepage design">

  <!-- Header -->
  <a class="hotspot h-top-logo" href="index.html" aria-label="VeBlyss Global home"></a>
  <a class="hotspot h-home" href="index.html" aria-label="Home"></a>
  <a class="hotspot h-products" href="products.html" aria-label="Products"></a>
  <a class="hotspot h-about" href="about.html" aria-label="h-about"></a>
  <a class="hotspot h-values" href="values.html" aria-label="h-values"></a>
  <a class="hotspot h-contact" href="contact.html" aria-label="Contact"></a>
  <button class="hotspot h-search" data-title="Search" data-message="Search functionality will be connected when the product catalogue is added." aria-label="Search"></button>
  <a class="hotspot h-enquire" href="mailto:info@veblyssglobal.com?subject=VeBlyss%20Enquiry" aria-label="Enquire Now"></a>

  <!-- Hero -->
  <a class="hotspot h-hero" href="products.html" aria-label="Explore Our Collection"></a>

  <!-- Product collection -->
  <a class="hotspot h-ghee" href="products/ghee.html" aria-label="Product"></a>
  <a class="hotspot h-coconut" href="products/coconut-oil.html" aria-label="Product"></a>
  <a class="hotspot h-pooja" href="products/pooja-oil.html" aria-label="Product"></a>
  <a class="hotspot h-wallet" href="products/leather-wallet.html" aria-label="Product"></a>
  <a class="hotspot h-copper" href="products/copper-bottles.html" aria-label="Product"></a>
  <a class="hotspot h-mug" href="products/beer-mug.html" aria-label="Product"></a>

  <!-- About / CTA -->
  <a class="hotspot h-story" href="about.html" aria-label="h-story"></a>
  <a class="hotspot h-journey" href="mailto:info@veblyssglobal.com?subject=VeBlyss%20Partnership%20or%20Bulk%20Order" aria-label="Contact Us"></a>

  <!-- Footer navigation -->
  <a class="hotspot h-footer-home" href="index.html" aria-label="Footer Home"></a>
  <a class="hotspot h-footer-products" href="products.html" aria-label="Products"></a>
  <a class="hotspot h-footer-about" href="about.html" aria-label="About"></a>
  <a class="hotspot h-footer-values" href="values.html" aria-label="Values"></a>
  <a class="hotspot h-footer-contact" href="contact.html" aria-label="Footer Contact"></a>
  <a class="hotspot h-footer-phone" href="tel:+919844844225" aria-label="Call VeBlyss Global"></a>
  <a class="hotspot h-footer-email" href="mailto:info@veblyssglobal.com" aria-label="Email VeBlyss Global"></a>
  <a class="hotspot h-footer-web" href="https://www.veblyssglobal.com" target="_blank" rel="noopener" aria-label="VeBlyss Global website"></a>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="box">
    <button class="close" id="close" aria-label="Close">×</button>
    <h2 id="modalTitle">VeBlyss Global</h2>
    <p id="modalMessage"></p>
    <div class="actions">
      <a class="btn" href="mailto:info@veblyssglobal.com?subject=VeBlyss%20Enquiry">Send an Enquiry</a>
      <a class="btn" href="tel:+919844844225">Call Us</a>
    </div>
    <p class="note">This is the exact-visual front-page functionality test. The visual design is intentionally kept as the approved artwork; real product pages, catalogue search, cart and checkout can be connected after this test is approved.</p>
  </div>
</div>

<script>
const modal=document.getElementById('modal');
const title=document.getElementById('modalTitle');
const message=document.getElementById('modalMessage');
const close=()=>modal.classList.remove('open');

document.querySelectorAll('[data-title]').forEach(el=>{
  el.addEventListener('click',()=>{
    title.textContent=el.dataset.title;
    message.textContent=el.dataset.message;
    modal.classList.add('open');
  });
});
document.getElementById('close').addEventListener('click',close);
modal.addEventListener('click',e=>{if(e.target===modal)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

document.querySelectorAll('a[href^="#"]').forEach(a=>{
  a.addEventListener('click',e=>{
    e.preventDefault();
    const target=a.getAttribute('href');
    if(target==='#home'){window.scrollTo({top:0,behavior:'smooth'});}
    else if(target==='#products'){
      document.querySelector('.h-ghee').focus();
      title.textContent='Our Product Collections';
      message.textContent='Select any of the six product areas in the approved design to test the interaction.';
      modal.classList.add('open');
    } else if(target==='#contact'){
      title.textContent='Contact VeBlyss Global';
      message.textContent='For enquiries, partnerships, or bulk orders, please use the email or phone options below.';
      modal.classList.add('open');
    }
  });
});
</script>
</body>
</html>
